services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: elgremio-postgres
    environment:
      POSTGRES_DB: elgremio
      POSTGRES_USER: elgremio
      POSTGRES_PASSWORD: elgremio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elgremio -d elgremio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: elgremio-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@elgremio.es
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
