spring:
  application:
    name: elgremio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/elgremio}
    username: ${DB_USERNAME:elgremio}
    password: ${DB_PASSWORD:elgremio}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.elgremio: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

jwt:
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

aws:
  region: ${AWS_REGION:eu-west-1}
  s3:
    bucket-public: ${S3_BUCKET_PUBLIC:elgremio-public}
    bucket-private: ${S3_BUCKET_PRIVATE:elgremio-private}
    bucket-docs: ${S3_BUCKET_DOCS:elgremio-docs}
  cdn-base-url: ${CDN_BASE_URL:https://cdn.elgremio.es}

sendgrid:
  from-email: ${SENDGRID_FROM_EMAIL:noreply@elgremio.es}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://elgremio.es}
